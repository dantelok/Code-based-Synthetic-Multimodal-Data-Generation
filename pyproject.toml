[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# Exclude the exploratory notebook and generated/vendored trees from linting.
extend-exclude = [".venv", "generated", "app", "node_modules", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E402",  # module-level imports after matplotlib.use() are intentional
    "E501",  # long lines are dominated by multi-line LLM prompt strings
]
